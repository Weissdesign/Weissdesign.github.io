<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>联系方式 | 郝于越</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --c-bg:      #ffffff;
      --c-bg-alt:  #f5f5f7;
      --c-border:  rgba(0,0,0,.08);
      --c-text:    #1d1d1f;
      --c-muted:   #6e6e73;
      --c-subtle:  #86868b;
      --c-accent:  #0071e3;
      --nav-h:     52px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      background: var(--c-bg); color: var(--c-text);
      line-height: 1.75; font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 3px; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      height: var(--nav-h);
      background: rgba(255,255,255,.82);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(0,0,0,.1);
    }
    .nav-inner {
      max-width: 960px; margin: 0 auto; padding: 0 2rem;
      height: 100%; display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo {
      font-size: .88rem; font-weight: 600; color: var(--c-text);
      letter-spacing: -.01em; text-decoration: none;
    }
    .nav-logo span { color: var(--c-accent); }
    .nav-back {
      font-size: .8rem; color: var(--c-muted); text-decoration: none;
      display: inline-flex; align-items: center; gap: .35rem;
      transition: color .15s;
    }
    .nav-back:hover { color: var(--c-accent); }

    .container { max-width: 960px; margin: 0 auto; padding: 0 2rem; }
    .page-wrap {
      padding-top: calc(var(--nav-h) + 4rem);
      padding-bottom: 5rem;
    }
    .sec-label {
      display: block; font-size: .68rem; font-weight: 600;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--c-accent); margin-bottom: .6rem;
    }
    h1 {
      font-size: 2rem; font-weight: 700; color: var(--c-text);
      letter-spacing: -.03em; line-height: 1.2;
      margin-bottom: 3rem; padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--c-border);
    }

    .contact-list { display: flex; flex-direction: column; }
    .contact-item {
      display: grid; grid-template-columns: 120px 1fr;
      gap: 1.5rem; align-items: baseline;
      padding: 1.4rem 0; border-bottom: 1px solid var(--c-border);
    }
    .contact-item:last-child { border-bottom: none; }
    .contact-label {
      font-size: .7rem; font-weight: 600; letter-spacing: .08em;
      color: var(--c-subtle);
    }
    .contact-value { font-size: .95rem; color: var(--c-text); font-weight: 400; }
    .copy-email {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: 0; border: 0; background: transparent;
      color: var(--c-accent); font: inherit; cursor: pointer;
      text-align: left; transition: opacity .15s;
    }
    .copy-email:hover { opacity: .72; }
    .copy-email:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 4px; border-radius: 2px; }
    .copy-icon { width: 15px; height: 15px; flex-shrink: 0; }
    .copy-feedback {
      display: inline-block; min-width: 4em; margin-left: .75rem;
      font-size: .75rem; color: var(--c-muted); vertical-align: middle;
    }

    @media (max-width: 640px) {
      h1 { font-size: 1.5rem; }
      .contact-item { grid-template-columns: 1fr; gap: .25rem; }
      .copy-email { word-break: break-all; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-logo" href="index.html">Yuyue <span>Hao</span></a>
    <a class="nav-back" href="index.html">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M10 3L5 8l5 5"/>
      </svg>
      返回主页
    </a>
  </div>
</nav>

<main class="container page-wrap">
  <p class="sec-label">取得联系</p>
  <h1>联系方式</h1>

  <div class="contact-list">
    <div class="contact-item">
      <div class="contact-label">电子邮箱</div>
      <div class="contact-value">
        <button class="copy-email" id="copy-email" type="button" aria-describedby="copy-feedback" title="点击复制电子邮箱">
          <span id="email-text">weissbj@mail.tsinghua.edu.cn</span>
          <svg class="copy-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="5.5" y="5.5" width="7" height="7" rx="1.2"/>
            <path d="M10.5 5.5V4.2A1.7 1.7 0 008.8 2.5H4.2a1.7 1.7 0 00-1.7 1.7v4.6a1.7 1.7 0 001.7 1.7h1.3"/>
          </svg>
        </button>
        <span class="copy-feedback" id="copy-feedback" role="status" aria-live="polite"></span>
      </div>
    </div>
    <div class="contact-item">
      <div class="contact-label">工作单位</div>
      <div class="contact-value">清华大学美术学院</div>
    </div>
    <div class="contact-item">
      <div class="contact-label">地址</div>
      <div class="contact-value">清华大学美术学院，北京市海淀区，中国</div>
    </div>
  </div>
</main>

<script>
  const copyButton = document.getElementById('copy-email');
  const emailText = document.getElementById('email-text').textContent;
  const feedback = document.getElementById('copy-feedback');
  let feedbackTimer;

  async function copyEmail() {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(emailText);
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = emailText;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        const copied = document.execCommand('copy');
        textarea.remove();
        if (!copied) throw new Error('copy failed');
      }
      feedback.textContent = '已复制';
    } catch (error) {
      feedback.textContent = '复制失败，请手动复制';
    }

    clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(() => { feedback.textContent = ''; }, 2200);
  }

  copyButton.addEventListener('click', copyEmail);
</script>
</body>
</html>
